<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="48" height="32">
  <!-- Wooden Bench Legs -->
  <rect x="6" y="20" width="4" height="11" rx="1" fill="#291a10"/>
  <rect x="38" y="20" width="4" height="11" rx="1" fill="#291a10"/>

  <!-- Lower Crossbeam -->
  <rect x="8" y="26" width="32" height="3" rx="0.5" fill="#362215"/>

  <!-- Bench Seat Plank Base -->
  <rect x="2" y="16" width="44" height="6" rx="2" fill="#422c1d"/>
  <line x1="3" y1="17" x2="45" y2="17" stroke="#5c3e29" stroke-width="0.8"/>

  <!-- Comfy Worn Cushion -->
  <rect x="5" y="12" width="38" height="5" rx="2" fill="#663e26"/>
  <!-- Tufted cushion button stitches -->
  <circle cx="12" cy="14.5" r="0.9" fill="#24140b"/>
  <circle cx="24" cy="14.5" r="0.9" fill="#24140b"/>
  <circle cx="36" cy="14.5" r="0.9" fill="#24140b"/>

  <!-- Hearth Lantern on Bench (Dormant Amber Ember) -->
  <rect x="20" y="2" width="8" height="10" rx="1" fill="#1f1813"/>
  <rect x="21" y="4" width="6" height="6" rx="0.5" fill="#3b2314"/>
  <circle cx="24" cy="7" r="1.5" fill="#e07722" opacity="0.8"/>
  <line x1="24" y1="0.5" x2="24" y2="2" stroke="#574230" stroke-width="1"/>
</svg>
