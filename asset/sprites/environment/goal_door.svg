<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">
  <defs>
    <radialGradient id="doorwayLight" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#fff8cc" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#ffe488" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fca834" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lightRays" x1="100%" y1="50%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#ffec99" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ffa834" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffa834" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Golden Rays spilling forward across the floor -->
  <polygon points="50,15 10,125 90,125" fill="url(#lightRays)"/>

  <!-- Warm ambient glow halo -->
  <circle cx="50" cy="65" r="48" fill="url(#doorwayLight)"/>

  <!-- Heavy Victorian Attic Door Frame -->
  <rect x="25" y="8" width="50" height="116" rx="4" fill="#3b2718"/>
  <rect x="27" y="10" width="46" height="112" rx="3" fill="#4d3522"/>
  <!-- Architrave molding highlights -->
  <line x1="28" y1="11" x2="72" y2="11" stroke="#694a31" stroke-width="1.2"/>
  <line x1="28" y1="11" x2="28" y2="121" stroke="#694a31" stroke-width="1.2"/>

  <!-- Interior Door Reveal (Golden Bedroom Beyond) -->
  <rect x="33" y="16" width="34" height="104" fill="#1b120c"/>
  <rect x="35" y="18" width="30" height="102" fill="#fffbe6"/>

  <!-- Brilliant Light Core -->
  <ellipse cx="50" cy="65" rx="14" ry="46" fill="#ffffff"/>

  <!-- Ajar Wooden Door Edge -->
  <polygon points="35,18 42,16 42,120 35,120" fill="#2d1c11"/>
  <line x1="42" y1="16" x2="42" y2="120" stroke="#1f130b" stroke-width="1.5"/>

  <!-- Small Brass Doorknob -->
  <circle cx="40" cy="68" r="1.8" fill="#d4af37"/>
  <circle cx="39.5" cy="67.5" r="0.6" fill="#ffffff"/>

  <!-- Threshold Plate -->
  <rect x="23" y="122" width="54" height="4" rx="1" fill="#291a10"/>
</svg>
