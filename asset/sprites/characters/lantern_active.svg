<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 26" width="20" height="26">
  <defs>
    <radialGradient id="activeBeamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fff8b8" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#ffb833" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8811" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Radiant Light Halo -->
  <circle cx="10" cy="15" r="9.5" fill="url(#activeBeamGlow)"/>

  <!-- Top Ring & Cap -->
  <circle cx="10" cy="3" r="2.2" stroke="#bda148" stroke-width="1.2" fill="none"/>
  <path d="M 6,5 L 14,5 L 13,8 L 7,8 Z" fill="#cfad4c"/>
  <rect x="7.5" y="8" width="5" height="1.5" fill="#8c6d26"/>

  <!-- Blazing Glass Chamber -->
  <rect x="6" y="9.5" width="8" height="9" rx="1.5" fill="#fffbe8"/>
  <circle cx="10" cy="14" r="3.2" fill="#ffffff"/>

  <!-- Golden Ray Flares -->
  <line x1="10" y1="9.5" x2="10" y2="6.5" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="10" y1="18.5" x2="10" y2="21.5" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="5.5" y1="14" x2="2.5" y2="14" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="14.5" y1="14" x2="17.5" y2="14" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Bottom Base -->
  <path d="M 6,18.5 L 14,18.5 L 15,21.5 L 5,21.5 Z" fill="#cfad4c"/>
  <rect x="7" y="21.5" width="6" height="1.5" rx="0.5" fill="#8c6d26"/>
</svg>
